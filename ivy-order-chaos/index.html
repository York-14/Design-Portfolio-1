<body>
<canvas id="cv" aria-label="蔦と葉が対称カオス写像に沿って伸び、秩序と混沌を繰り返すジェネラティブアート"></canvas>

<div class="hud" id="hud">
  <div class="corner tl">
    <div class="phase"><span class="ja" id="phaseJa">萌芽</span><span class="en" id="phaseEn">SPROUT</span></div>
    <div class="cycle" id="cycle">SEEKING …</div>
  </div>
  <div class="corner bl">
    <div class="title">Beauty Between Order and Chaos</div>
    <div class="formula">z<sub>t+1</sub> = (λ + α|z|² + β Re(z<sup>n</sup>) + iω) z + γ z̄<sup>n−1</sup></div>

  </div>
  <div class="corner br">
    <div class="tempo"><b id="bpm">84</b><small>BPM</small><span class="dot" id="dot"></span></div>

  </div>
</div>
<div class="hint" id="hint">TAP — RIPPLE &nbsp;·&nbsp; DRAG — REACH &nbsp;·&nbsp; M MODE &nbsp;·&nbsp; S SOUND &nbsp;·&nbsp; F FULLSCREEN &nbsp;·&nbsp; H HUD</div>

<script>
(() => {
'use strict';

// =====================================================================================
// 0. 基本ユーティリティ
// =====================================================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
const fract = x => x - Math.floor(x);
const easeOutBack = t => { t = clamp(t, 0, 1); const c = 1.6; return 1 + (c + 1) * (t - 1) ** 3 + c * (t - 1) ** 2; };
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const $ = id => document.getElementById(id);

const URLP = new URLSearchParams(location.search);
const HUD_DEFAULT = URLP.get('hud') !== '0';
const LOW = URLP.get('quality') === 'low';
const SPEED = clamp(parseFloat(URLP.get('speed')) || 1, 0.1, 16);   // プレビュー用の時間倍率

// =====================================================================================
// 1. 数理モデル：Field & Golubitsky の対称カオス写像（元コードを踏襲）
//    z_{t+1} = (λ + α|z|² + β Re(zⁿ) + iω) z + γ z̄^{n−1}
// =====================================================================================
let NX = 0, NY = 0;
function step(q, x, y) {
  const zz = x * x + y * y;
  let zr = x, zi = y;
  for (let i = 1; i < q.n - 1; i++) { const t = zr * x - zi * y; zi = zr * y + zi * x; zr = t; }
  const ren = zr * x - zi * y;
  const p = q.lam + q.alpha * zz + q.beta * ren;
  NX = p * x - q.omega * y + q.gamma * zr;
  NY = p * y + q.omega * x - q.gamma * zi;
}
function probe(q, N = 20000) {
  let x = 0.01, y = 0.003, R = 0;
  for (let i = 0; i < N; i++) {
    step(q, x, y); x = NX; y = NY;
    if (!(Math.abs(x) + Math.abs(y) < 1e4)) return null;
    if (i > 1000) { const r = x * x + y * y; if (r > R) R = r; }
  }
  R = Math.sqrt(R);
  return R > 1e-6 ? { R, x, y } : null;
}
// ボックス次元・余白・もや・斑点・角度コントラスト・最大 Lyapunov 指数
function analyze(q) {
  const pr = probe(q);
  if (!pr) return null;
  const G = 128, h = new Float32Array(G * G);
  let x = pr.x, y = pr.y, max = 1;
  for (let i = 0; i < 80000; i++) {
    step(q, x, y); x = NX; y = NY;
    const gx = ((x / pr.R) * 0.5 + 0.5) * (G - 1) | 0, gy = ((y / pr.R) * 0.5 + 0.5) * (G - 1) | 0;
    if (gx >= 0 && gx < G && gy >= 0 && gy < G) { const v = ++h[gy * G + gx]; if (v > max) max = v; }
  }
  const occ32 = new Uint8Array(32 * 32);
  let c128 = 0, c32 = 0, occDisk = 0, disk = 0, haze = 0, speck = 0;
  const ang = new Float64Array(72), lm = Math.log1p(max), c = (G - 1) / 2;
  for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) {
    const k = j * G + i, dx = i - c, dy = j - c, r2 = dx * dx + dy * dy, inD = r2 <= (G / 2) ** 2;
    if (inD) disk++;
    if (!h[k]) continue;
    c128++; if (inD) occDisk++;
    const o = (j >> 2) * 32 + (i >> 2); if (!occ32[o]) { occ32[o] = 1; c32++; }
    if (Math.log1p(h[k]) / lm < 0.4) haze++;
    const nb = (i > 0 && h[k - 1] > 0) + (i < G - 1 && h[k + 1] > 0) + (j > 0 && h[k - G] > 0) + (j < G - 1 && h[k + G] > 0);
    if (nb <= 2) speck++;
    if (r2 > (0.3 * G / 2) ** 2) ang[Math.floor((Math.atan2(dy, dx) / TAU + 0.5) * 72) % 72] += h[k];
  }
  const am = ang.reduce((a, b) => a + b, 0) / 72;
  const actr = am > 0 ? Math.sqrt(ang.reduce((a, b) => a + (b - am) ** 2, 0) / 72) / am : 0;
  const d0 = 1e-8; let x2 = x + d0, y2 = y, lsum = 0;
  for (let i = 0; i < 3000; i++) {
    step(q, x, y); const ax = NX, ay = NY;
    step(q, x2, y2);
    const dx = NX - ax, dy = NY - ay, dd = Math.hypot(dx, dy) || 1e-300;
    lsum += Math.log(dd / d0);
    x = ax; y = ay; x2 = ax + dx * d0 / dd; y2 = ay + dy * d0 / dd;
  }
  return { q, R: pr.R, D: Math.log2(c128 / Math.max(c32, 1)) / 2, fill: occDisk / disk,
           haze: haze / c128, speckle: speck / c128, actr, lyap: lsum / 3000, mirror: q.omega === 0 ? 1 : 0 };
}
const isGood = a => a && a.D > 1.3 && a.D < 1.95 && a.fill > 0.08 && a.fill < 0.8 && a.lyap > 0.01;
const logBell = (x, mu, s) => -0.5 * ((x - mu) / s) ** 2;
const sig = (x, x0, s) => 1 / (1 + Math.exp(-(x - x0) / s));
// Beauty = Order × Complexity × Contrast（shape_map.py のブラウザ近似）
function beautyOf(a) {
  const neg = 1 - a.fill, ll = Math.log(Math.max(a.lyap, 1e-4));
  const logO = logBell(Math.log(a.q.n), Math.log(6), 0.55) + Math.log(0.65 + 0.35 * a.mirror)
             + Math.log(0.3 + 0.7 * sig(a.actr, 0.5, 0.15));
  const logC = 0.5 * (logBell(a.D, 1.72, 0.11) + logBell(ll, Math.log(0.35), 0.7));
  const logK = (logBell(neg, 0.45, 0.22) + Math.log(1 - 0.6 * sig(a.haze, 0.5, 0.1))
              + Math.log(1 - 0.7 * sig(a.speckle, 0.2, 0.04))) / 3;
  return { O: Math.exp(logO), C: Math.exp(logC), K: Math.exp(logK), B: Math.exp(logO + logC + logK) };
}
const lerpQ = (a, b, t) => ({ n: a.n, lam: lerp(a.lam, b.lam, t), alpha: lerp(a.alpha, b.alpha, t),
  beta: lerp(a.beta, b.beta, t), gamma: lerp(a.gamma, b.gamma, t), omega: lerp(a.omega, b.omega, t) });
// パラメータ探索の範囲（元コードと同じ）。rand は [0,1) を返す関数（確率の乱数でもカオス由来でもよい）
function randomParams(rand = Math.random) {
  const r = (lo, hi) => lo + rand() * (hi - lo);
  return { n: 3 + Math.floor(rand() * 8), lam: r(-2.8, 2.8), alpha: r(-5, 5), beta: r(-1.5, 1.5),
           gamma: r(-1.2, 1.2), omega: rand() < 0.5 ? 0 : r(-0.3, 0.3) };
}
const PRESETS = [
  ["Emperor's Cloak", { lam: -2.08, alpha: 1.0, beta: -0.1, gamma: 0.167, omega: 0, n: 7 }],
  ["Starfish", { lam: -2.34, alpha: 2.0, beta: 0.2, gamma: 0.1, omega: 0, n: 5 }],
  ["Sand Dollar", { lam: -2.7, alpha: 5.0, beta: 1.5, gamma: 1.0, omega: 0, n: 6 }],
  ["Pentagon", { lam: -1.806, alpha: 1.806, beta: 0, gamma: 1.0, omega: 0, n: 5 }],
  ["Fish", { lam: -2.5, alpha: 5.0, beta: -1.9, gamma: 1.0, omega: 0.188, n: 5 }],
  ["Clam Triple", { lam: 1.56, alpha: -1.0, beta: 0.1, gamma: -0.82, omega: 0.12, n: 3 }],
];

// 蔦が辿る「地形」：アトラクタ密度を log 圧縮してぼかしたスカラー場（半径 1 に正規化）
const FG = 128, FH = 1.18;
function buildField(q, pr) {
  const f = new Float32Array(FG * FG);
  let x = pr.x, y = pr.y, max = 1;
  const sc = (FG - 1) / (2 * FH * pr.R);
  for (let i = 0; i < 160000; i++) {
    step(q, x, y); x = NX; y = NY;
    const gx = ((x * sc) + (FG - 1) / 2) | 0, gy = ((y * sc) + (FG - 1) / 2) | 0;
    if (gx >= 0 && gx < FG && gy >= 0 && gy < FG) { const v = ++f[gy * FG + gx]; if (v > max) max = v; }
  }
  const lm = Math.log1p(max);
  for (let i = 0; i < f.length; i++) f[i] = Math.log1p(f[i]) / lm;
  const tmp = new Float32Array(f.length);
  for (let pass = 0; pass < 3; pass++) {
    for (let j = 0; j < FG; j++) for (let i = 0; i < FG; i++) {
      let s = 0, c = 0;
      for (let d = -2; d <= 2; d++) { const ii = i + d; if (ii >= 0 && ii < FG) { s += f[j * FG + ii]; c++; } }
      tmp[j * FG + i] = s / c;
    }
    for (let j = 0; j < FG; j++) for (let i = 0; i < FG; i++) {
      let s = 0, c = 0;
      for (let d = -2; d <= 2; d++) { const jj = j + d; if (jj >= 0 && jj < FG) { s += tmp[jj * FG + i]; c++; } }
      f[j * FG + i] = s / c;
    }
  }
  let m = 0; for (let i = 0; i < f.length; i++) if (f[i] > m) m = f[i];
  if (m > 0) for (let i = 0; i < f.length; i++) f[i] /= m;
  return f;
}

// 「秩序の花」から「混沌の相棒」を探す：ω を立てて鏡映を壊し、Lyapunov 指数が大きい有界な近傍
function* specJob(q, name, rand = Math.random, meta = {}) {
  const rnd = (lo, hi) => lo + rand() * (hi - lo);
  const pr = probe(q); if (!pr) return null;
  const a = analyze(q); yield;
  if (!a) return null;
  const field = buildField(q, pr); yield;
  let best = null, bestScore = -Infinity;
  for (let t = 0; t < 22; t++) {
    const s = rand() < 0.5 ? -1 : 1;
    const c = { n: q.n, omega: q.omega + s * rnd(0.07, 0.22), lam: q.lam + rnd(-0.22, 0.22),
                gamma: q.gamma * rnd(0.75, 1.25) + rnd(-0.12, 0.12), beta: q.beta + rnd(-0.25, 0.25), alpha: q.alpha * rnd(0.9, 1.12) };
    const ac = analyze(c); yield;
    if (!ac || ac.fill < 0.05) continue;
    let ok = true;
    for (const f of [0.25, 0.5, 0.75]) if (!probe(lerpQ(q, c, f), 6000)) { ok = false; break; }
    if (!ok) continue;
    const score = ac.lyap - 0.6 * Math.abs(ac.fill - 0.4) + (ac.D > 1.45 ? 0.15 : 0);
    if (score > bestScore) { bestScore = score; best = { q: c, R: ac.R, a: ac }; }
  }
  if (!best) { const c = { ...q, omega: q.omega + 0.1 }; const p2 = probe(c); best = { q: c, R: p2 ? p2.R : pr.R, a: null }; }
  return { q, name, R: pr.R, x0: pr.x, y0: pr.y, a, beauty: beautyOf(a), field, qc: best.q, Rc: best.R, ac: best.a, ...meta };
}
const runSync = gen => { let r; do r = gen.next(); while (!r.done); return r.value; };

// =====================================================================================
// 1.5 次の花の選び方：数式は固定し、パラメータだけを動かす。2 つのモードを URL で切り替える
//   ?mode=walk  (B) パラメータ空間の散歩：前の花の近傍へ一歩ずつ。Beauty が高い方へ渡り歩く
//   ?mode=chaos (C) カオス由来：今の花のアトラクタ軌道そのものを乱数源にして次の花を生む
//   ?seed=xxx   同じ SEED なら同じ花の連なりを再現する（細部の揺らぎは毎回変わる）
// =====================================================================================
let MODE = URLP.get('mode') === 'chaos' ? 'chaos' : 'walk';   // 画面右上のボタンでも切り替えられる
const SEED_STR = (URLP.get('seed') || '').trim().slice(0, 32) ||
  Math.floor(Math.random() * 36 ** 6).toString(36).padStart(6, '0');
function hashSeed(str) {          // FNV-1a 32bit
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
function mulberry32(a) {          // B 用：SEED から決まる擬似乱数
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const SEED = hashSeed(SEED_STR);
const accept = a => isGood(a) && a.fill > 0.12 && a.fill < 0.7;

// 候補を k 個集め、Beauty 最大のものを返す（初手・行き詰まり時の跳躍に使う）
function* searchBest(rand, k = 6) {
  let best = null, found = 0, tries = 0;
  while (found < k && tries < 6000) {
    const a = analyze(randomParams(rand)); tries++;
    if (accept(a)) { a.B = beautyOf(a).B; found++; if (!best || a.B > best.B) best = a; }
    if (tries % 3 === 0) yield;
  }
  return best;
}

// --- B. パラメータ空間の散歩 ---
function makeWalkPicker(rand) {
  const gauss = () => { const u = Math.max(rand(), 1e-12), v = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };
  const SIG = { lam: 0.16, alpha: 0.38, beta: 0.11, gamma: 0.11 };
  const LIM = { lam: [-2.8, 2.8], alpha: [-5, 5], beta: [-1.5, 1.5], gamma: [-1.2, 1.2] };
  function mutate(q) {
    const m = { ...q };
    for (const k in SIG) m[k] = clamp(q[k] + gauss() * SIG[k], LIM[k][0], LIM[k][1]);
    if (rand() < 0.12) m.n = clamp(q.n + (rand() < 0.5 ? -1 : 1), 3, 12);           // 対称次数の分岐

    f.type = 'bandpass'; f.frequency.value = rnd(2500, 6000); f.Q.value = 1.2;
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vel, t + 0.08); gn.gain.exponentialRampToValueAtTime(0.0001, t + rnd(0.3, 0.9));
    s.connect(f); f.connect(gn); gn.connect(master); gn.connect(verbIn); s.start(t); s.stop(t + 1);
  }
  const PENTA = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22];
  const OUT = [1, 6, 8, 11, 13, 18];
  function beat(i, chaos, n, bpm, bloom) {
    if (!on) return;
    const t = ac.currentTime + 0.02, spb = 60 / bpm;
    if (i % 4 === 0) thump(t, 0.55 - chaos * 0.15);
    else if (chaos > 0.4 && Math.random() < chaos * 0.6) thump(t, 0.25);
    const idx = (i * n) % PENTA.length;
    pluck(ROOT * 2 ** ((PENTA[idx] + 12) / 12), t, 0.3 * (1 - chaos * 0.4), 0.3 + chaos * 0.6);
    if (bloom > 0.3) pluck(ROOT * 2 ** ((PENTA[(idx + 2) % PENTA.length] + 24) / 12), t + spb / 2, 0.13 * bloom, 0.8);
    if (chaos > 0.15) {
      const k = 1 + (Math.random() * 3 * chaos | 0);
      for (let j = 0; j < k; j++) {
        const semi = Math.random() < chaos * 0.6 ? OUT[Math.random() * OUT.length | 0] : PENTA[Math.random() * PENTA.length | 0];
        pluck(ROOT * 2 ** ((semi + 12 * (Math.random() < 0.5 ? 2 : 1)) / 12), t + Math.random() * spb, 0.13 * chaos, 0.9);
      }
      if (Math.random() < chaos) rustle(t + Math.random() * spb * 0.5, 0.05 + 0.07 * chaos);
    }
  }
  function update(chaos) {
    if (!on) return;
    padF.frequency.setTargetAtTime(900 + chaos * 2400, ac.currentTime, 0.6);
    for (const [o] of oscs) o.detune.setTargetAtTime(rnd(-7, 7) * (1 + chaos * 5), ac.currentTime, 1.5);
  }
  function setRoot(semi) {
    if (!ac) return;
    for (const [o, s] of oscs) o.frequency.setTargetAtTime(ROOT * 2 ** ((s + semi) / 12), ac.currentTime, 2.5);
  }
  return { toggle, beat, update, setRoot, revive, get on() { return on; } };
})();

// =====================================================================================
// 8. 庭のスケジューラ：裏で次の「美しい花」を探索（Beauty 最大）し、秩序⇄混沌を周期で回す
// =====================================================================================
const CYCLE = 64;   // 1 輪あたりの拍数
const ready = [];
let job = null;
const nextJob = () => pickJob();
function runJobs(budgetMs) {
  const t0 = performance.now();
  while (performance.now() - t0 < budgetMs) {
    if (!job) { if (ready.length >= 2) return; job = nextJob(); }
    const r = job.next();
    if (r.done) { if (r.value) ready.push(r.value); job = null; }
  }
}
const gardens = [];
function plant(spec) {
  state.theme = gardens.length ? (state.theme + 1) % THEMES.length : 0;
  const g = new Garden(spec, state.beat, state.theme);
  gardens.push(g);
  Dust.setTheme(g.theme); Dust.setSpec(spec);
  Sound.setRoot([0, -2, 3, -4, 5, -5][state.cycle % 6]);
  state.cycle++;
  updateHudStatic(g);
  if (window.__ivy) (window.__ivy.log || (window.__ivy.log = [])).push({ t: performance.now(), label: spec.name || spec.label, q: spec.q, B: spec.beauty.B });
}

// =====================================================================================
// 9. テンポ：80–120 BPM を、混沌の緊張・ゆっくりした情動の LFO・観客の関わりで往復する
// =====================================================================================
function updateTempo(dt) {
  const lfo = 0.5 + 0.5 * Math.sin(TAU * state.time / 96 - 1.2);
  const tension = clamp(0.06 + 0.64 * state.chaos + 0.2 * lfo + 0.5 * state.energy, 0, 1);
  const target = 80 + 40 * tension;
  state.bpm += (target - state.bpm) * (1 - Math.exp(-dt / 2.2));
  state.bpm = clamp(state.bpm, 80, 120);
}
function onBeat(i) {
  state.beatFlag = true;
  const lead = gardens[gardens.length - 1];
  const order = 1 - state.chaos;
  if (i % 4 === 0 || state.chaos > 0.45)
    rings.push({ t0: state.time, str: (i % 4 === 0 ? 0.22 : 0.1) * (0.4 + 0.6 * Math.max(order, state.chaos)), seed: rnd(0, TAU), n: lead ? lead.n : 0 });
  const bloom = lead ? smooth(26, 34, lead.gb) * (1 - smooth(44, 50, lead.gb)) : 0;
  Sound.beat(i, state.chaos, lead ? lead.n : 5, state.bpm, bloom);
  const dot = $('dot'); dot.style.setProperty('--p', 1);
}

// =====================================================================================
// 10. HUD
// =====================================================================================
const hud = $('hud');
let hudOn = HUD_DEFAULT;
hud.classList.toggle('off', !hudOn);
const PHASES = [[6, '萌芽', 'SPROUT'], [28, '成長', 'GROWTH'], [45, '開花', 'BLOOM · ORDER'], [60, '混沌', 'CHAOS'], [1e9, '還元', 'RETURN']];
function updateHudStatic(g) {
  $('cycle').textContent = `№ ${String(state.cycle).padStart(3, '0')} · ${(g.name || g.label || 'DISCOVERED').toUpperCase()} · ${g.theme.name} · SEED ${SEED_STR}`;
}
$('cycle').textContent = `SEEKING … · ${MODE === 'chaos' ? 'CHAOS-BORN' : 'WALK'} · SEED ${SEED_STR}`;
let hudTick = 0, lastPhase = '';
function updateHud() {
  const dot = $('dot');
  dot.style.setProperty('--p', (0.35 + 0.65 * state.beatEnv).toFixed(3));
  if (++hudTick % 5) return;
  $('bpm').textContent = Math.round(state.bpm);
  const g = gardens[gardens.length - 1];
  if (!g) return;
  const lead = gardens.find(x => x.gb < 64) || g;
  $('bpm').textContent = Math.round(state.bpm);
  const c = clamp(state.chaos, 0, 1) * 100;
  $('mark').style.left = c + '%'; $('fill').style.width = c + '%';
  const ph = PHASES.find(p => lead.gb < p[0]);
  if (ph[1] !== lastPhase) { lastPhase = ph[1]; $('phaseJa').textContent = ph[1]; $('phaseEn').textContent = ph[2]; }
  const q = lerpQ(lead.q, lead.qc, clamp(lead.chaos, 0, 1)), b = lead.beauty, ly = lerp(lead.a.lyap, lead.ac ? lead.ac.lyap : lead.a.lyap, clamp(lead.chaos, 0, 1));
  $('metrics').textContent =
    `n ${q.n}  λ ${q.lam.toFixed(3)}  α ${q.alpha.toFixed(3)}  β ${q.beta.toFixed(3)}  γ ${q.gamma.toFixed(3)}  ω ${q.omega.toFixed(3)}\n` +
    `Lyapunov ${ly.toFixed(3)}  ·  Beauty ${b.B.toFixed(3)} = O ${b.O.toFixed(2)} × C ${b.C.toFixed(2)} × K ${b.K.toFixed(2)}`;
}

// =====================================================================================
// 11. インタラクション
// =====================================================================================
let idleTimer = 0;
function wake() { document.body.classList.remove('idle'); idleTimer = 0; }
cv.addEventListener('pointermove', e => {
  const x = e.clientX * DPR, y = e.clientY * DPR, now = performance.now();
  const dtm = Math.max(8, now - pointer.last);
  if (pointer.active || e.pointerType === 'mouse') {
    const sp = Math.hypot(x - pointer.x, y - pointer.y) / DPR / dtm * 1000;
    state.energy = clamp(state.energy + Math.min(sp, 2400) / 2400 * 0.035, 0, 1);
  }
  pointer.x = x; pointer.y = y; pointer.last = now; pointer.active = true;
  wake();
});
cv.addEventListener('pointerdown', e => {
  Sound.revive();
  pointer.x = e.clientX * DPR; pointer.y = e.clientY * DPR; pointer.active = true; pointer.last = performance.now();
  shocks.push({ x: pointer.x, y: pointer.y, r: 0, w: 70 * DPR, amp: 34 * DPR, t0: state.time });
  if (shocks.length > 4) shocks.shift();
  state.energy = clamp(state.energy + 0.22, 0, 1);
  state.boost = clamp(state.boost + 0.38, 0, 1);
  const g = gardens[gardens.length - 1];
  burstPollen(pointer.x, pointer.y, g ? g.theme : THEMES[0], 18);
  wake();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) Sound.revive(); });
cv.addEventListener('pointerleave', () => { pointer.active = false; });
cv.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') pointer.active = false; });
cv.addEventListener('dblclick', () => toggleFullscreen());
function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  else document.exitFullscreen?.();
}
// 花の選び方（WALK / CHAOS）の切り替え：次の花から新しいモードで選び、今の花は早めに混沌へ送る
let pendingSwitch = false;
function syncModeUI() {
  for (const id of ['modeWalk', 'modeChaos']) {
    const b = $(id), on = b.dataset.mode === MODE;
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  }
}
function setMode(m) {
  if (m === MODE) return;
  MODE = m; resetPicker();
  ready.length = 0; job = null; pendingSwitch = true;
  syncModeUI();
  $('cycle').textContent = `→ ${MODE === 'chaos' ? 'CHAOS-BORN' : 'WALK'} · SEED ${SEED_STR}`;
  try { const u = new URL(location.href); u.searchParams.set('mode', MODE); history.replaceState(null, '', u); } catch (e) {}
}
for (const id of ['modeWalk', 'modeChaos']) $(id).addEventListener('click', e => { e.stopPropagation(); setMode(e.currentTarget.dataset.mode); wake(); });
syncModeUI();
const sndBtn = $('snd');
function toggleSound() {
  const on = Sound.toggle();
  sndBtn.textContent = on ? 'SOUND ON' : 'SOUND OFF';
  sndBtn.classList.toggle('on', on); sndBtn.setAttribute('aria-pressed', on);
}
sndBtn.addEventListener('click', e => { e.stopPropagation(); toggleSound(); });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'h') { hudOn = !hudOn; hud.classList.toggle('off', !hudOn); }
  else if (k === 'f') toggleFullscreen();
  else if (k === 's') toggleSound();
  else if (k === 'm') setMode(MODE === 'walk' ? 'chaos' : 'walk');
  else if (k === ' ') { e.preventDefault(); state.boost = 1; state.energy = clamp(state.energy + 0.4, 0, 1); }
  wake();
});
setTimeout(() => $('hint').classList.add('gone'), 9000);

// =====================================================================================
// 12. メインループ
// =====================================================================================
// 起動は止めない：最初の花は裏で探す。見つかるまでは中心の種火だけが拍に合わせて灯る
const seekStart = performance.now();
let last = performance.now(), slowAcc = 0, slowFrames = 0;
function update(dt) {
  state.time += dt;
  idleTimer += dt;
  if (idleTimer > 3.5) { document.body.classList.add('idle'); if (idleTimer > 6) pointer.active = false; }
  state.energy *= Math.exp(-dt / 5);
  state.boost *= Math.exp(-dt / 2.4);
  // 混沌度：庭の位相（最大値）＋タップの衝撃
  let ch = 0; for (const g of gardens) ch = Math.max(ch, g.chaos * smooth(0, 0.3, g.alpha + 0.3));
  state.chaos = clamp(ch + state.boost * 0.45, 0, 1);
  updateTempo(dt);
  const prev = state.beat;
  const dB = dt * state.bpm / 60;
  state.beat += dB;
  state.beatFlag = false;
  if (Math.floor(state.beat) !== Math.floor(prev)) onBeat(Math.floor(state.beat));
  state.beatEnv = Math.exp(-fract(state.beat) * 5.5);
  state.barEnv = Math.exp(-fract(state.beat / 4) * 6);
  view.rot += dt * (0.012 + state.chaos * 0.03);
  // 庭の世代交代
  const lead = gardens[gardens.length - 1];
  if (!lead) {
    runJobs(LOW ? 9 : 12);
    if (ready.length) { plant(ready.shift()); pendingSwitch = false; }
    else if (performance.now() - seekStart > 15000) plant(runSync(specJob({ ...PRESETS[0][1] }, PRESETS[0][0])));  // 保険
    updateParticles(dt);
    return;
  }
  if (pendingSwitch && ready.length) {    // 新しいモードの花が用意できたら、今の花を混沌の入口まで進める
    pendingSwitch = false;
    if (lead.gb < 45) lead.born = state.beat - 45;
  }
  if (lead.gb >= CYCLE && ready.length) plant(ready.shift());
  else if (lead.gb >= CYCLE + 3) plant(lead.spec);   // 探索が間に合わなければ同じ花をもう一度
  for (const g of gardens) g.update(state.beat, dB);
  while (gardens.length > 1 && gardens[0].gb > 77) gardens.shift();
  runJobs(LOW ? 2.5 : 4);
  for (const s of shocks) { const age = state.time - s.t0; s.r = age * 900 * DPR; s.amp = 34 * DPR * Math.exp(-age * 1.6); }
  while (shocks.length && shocks[0].amp < 0.01) shocks.shift();
  updateParticles(dt);
  Dust.update(state.chaos);
  Sound.update(state.chaos);
}
function render() {
  const g = ctx, t = state.time;
  const minWH = Math.min(W, H);
  view.cx = W / 2; view.cy = H / 2;
  view.S = Math.min(W * (W < H ? 0.47 : 0.4), H * 0.44) * (1 + 0.012 * state.beatEnv + 0.018 * state.barEnv * (1 - state.chaos));
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-over';
  // 背景（混沌では残像を残す）
  const lead = gardens[gardens.length - 1], prevG = gardens.length > 1 ? gardens[0] : null;
  if (!lead) {   // 最初の花を探している間：種火だけ
    g.globalAlpha = 1; g.fillStyle = THEMES[0].bgGrad; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'lighter';
    const r = view.S * (0.07 + 0.05 * state.beatEnv + 0.03 * Math.sin(t * 0.8));
    g.globalAlpha = 0.35 + 0.4 * state.beatEnv;
    g.drawImage(THEMES[0].seedGlow, view.cx - r, view.cy - r, r * 2, r * 2);
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
    drawParticles(g);
    g.fillStyle = view.vignette; g.fillRect(0, 0, W, H);
    return;
  }
  g.globalAlpha = 1 - 0.42 * state.chaos;
  g.fillStyle = (prevG && prevG.alpha > lead.alpha ? prevG : lead).theme.bgGrad;
  g.fillRect(0, 0, W, H);
  if (prevG) { g.globalAlpha = (1 - 0.42 * state.chaos) * lead.alpha * 0.999; g.fillStyle = lead.theme.bgGrad; g.fillRect(0, 0, W, H); }
  // 塵（アトラクタ）
  g.globalCompositeOperation = 'lighter';
  const ds = view.S / 0.46;
  g.globalAlpha = clamp(0.5 + 0.45 * state.chaos + 0.15 * state.beatEnv, 0, 1);
  g.save(); g.translate(view.cx, view.cy); g.rotate(view.rot);
  g.drawImage(Dust.canvas, -ds / 2, -ds / 2, ds, ds);
  g.restore();
  // 中心の種の光
  const seedA = smooth(0, 2, lead.gb) * (1 - smooth(10, 26, lead.gb)) * 0.7 + 0.12 * state.beatEnv * (1 - state.chaos);
  if (seedA > 0.01) { const r = view.S * (0.12 + 0.06 * state.beatEnv); g.globalAlpha = seedA; g.drawImage(lead.theme.seedGlow, view.cx - r, view.cy - r, r * 2, r * 2); }
  // 拍の波紋：秩序では n 回対称の花形、混沌では歪む
  g.lineWidth = Math.max(1, 1.1 * DPR);
  for (let i = rings.length - 1; i >= 0; i--) {
    const rg = rings[i], age = state.time - rg.t0, life = 1 - age / 3.2;
    if (life <= 0) { rings.splice(i, 1); continue; }
    const r0 = view.S * (0.08 + age * 0.42);
    g.globalAlpha = rg.str * life * life;
    g.strokeStyle = rgba(lead.theme.ring);
    g.beginPath();
    for (let k = 0; k <= 160; k++) {
      const ph = k / 160 * TAU;
      const rr = r0 * (1 + 0.035 * (1 - state.chaos) * Math.cos(rg.n * (ph - view.rot))
        + 0.07 * state.chaos * Math.sin(3 * ph + age * 5 + rg.seed) * Math.sin(7 * ph - age * 3));
      const x = view.cx + Math.cos(ph) * rr, y = view.cy + Math.sin(ph) * rr;
      k ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
  // 蔦・葉・花
  for (const gd of gardens) gd.draw(g, t);
  g.globalCompositeOperation = 'lighter';
  // 曼荼羅の中心：その回の写像のアトラクタを鼓動に合わせて灯す
  for (const gd of gardens) {
    const ma = gd.alpha * (0.55 + 0.35 * state.beatEnv) * (1 - 0.5 * gd.chaos);
    if (ma < 0.01) continue;
    const r = view.S * 0.085 * (1 + 0.1 * state.beatEnv + 0.08 * state.barEnv);
    g.globalAlpha = ma;
    g.save(); g.translate(view.cx, view.cy); g.rotate(-view.rot * 2);
    g.drawImage(gd.icon, -r, -r, r * 2, r * 2);
    g.restore();
  }
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
  // 粒子
  drawParticles(g);
  // ビネット
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.fillStyle = view.vignette; g.fillRect(0, 0, W, H);
}
function frame(now) {
  requestAnimationFrame(frame);
  const raw = (now - last) / 1000; last = now;
  const dt = Math.min(0.05, Math.max(0, raw)) * SPEED;
  try {
    const t0 = performance.now();
    update(dt);
    const t1 = performance.now();
    render();
    updateHud();
    if (window.__ivy) { const P = window.__ivy.perf || (window.__ivy.perf = { u: 0, r: 0, n: 0 }); P.u += t1 - t0; P.r += performance.now() - t1; P.n++;
      P.leaves = gardens.reduce((s, g) => s + (g._leafQ ? g._leafQ.length / 5 : 0), 0); P.fall = falling.length; P.pollen = pollen.length; }
  } catch (err) { console.error(err); }
  // 重い端末では解像度を自動で下げる（サイネージ常時稼働向け）
  slowAcc += raw; slowFrames++;
  if (slowFrames >= 90) {
    const avg = slowAcc / slowFrames * 1000;
    if (avg > 26 && DPR_MAX > 1) { DPR_MAX = Math.max(1, DPR_MAX - 0.25); resize(); }
    slowAcc = 0; slowFrames = 0;
  }
}
requestAnimationFrame(frame);
})();
</script>
